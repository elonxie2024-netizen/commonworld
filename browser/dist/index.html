<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1740">
<title>Commonworld · Civilization simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%235b5bf0%27/%3E%3Ccircle cx=%2712%27 cy=%2713%27 r=%274%27 fill=%27%232dd4bf%27/%3E%3Ccircle cx=%2720%27 cy=%2720%27 r=%275%27 fill=%27%23fb923c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#" aria-label="Commonworld home">
    <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><circle cx="11" cy="12" r="3.2" fill="#2dd4bf"/><circle cx="21" cy="11" r="2.6" fill="#fb923c"/><circle cx="19" cy="21" r="3.6" fill="#a78bfa"/><circle cx="9.5" cy="21" r="2.2" fill="#60a5fa"/></svg></span>
    <span><b>Commonworld</b><small>Civilization simulator</small></span>
  </a>
  <nav id="navigation" aria-label="Sections"></nav>
  <div class="side-foot">
    <button id="new-world" class="side-btn">＋ New simulation</button>
    <form id="seed-form" class="seed-form" title="Type a seed and press Go to start a new world from it (same seed, same world)"><label>Seed<input id="seed-input" type="number" min="1" step="1" required autocomplete="off"></label><button class="soft">Go</button></form>
    <div class="side-row"><button id="save">↓ Save</button><button id="load">↑ Open</button></div>
    <input id="load-file" type="file" accept=".json,application/json" hidden>
    
  </div>
</aside>

<div class="shell">
  <header class="topbar">
    <div class="title"><h1 id="page-title">Overview</h1><p id="page-description"></p></div>
    <div class="controls">
      <span class="year-pill">Year <b id="year-num">0</b> <i id="season" class="season"></i></span>
      <span class="busy-dot" aria-hidden="true"></span><span id="progress" class="progress" hidden></span>
      <button id="undo" class="ghost" title="Undo the most recent edit" disabled>↶ Undo</button>
      <select id="speed" aria-label="Autoplay speed"><option value="1400">1× speed</option><option value="500">2× speed</option><option value="200">4× speed</option></select>
      <button id="play" title="Play or stop"></button>
      <div class="btn-group" role="group" aria-label="Advance several years"><button data-years="5">+5 yrs</button><button data-years="10">+10 yrs</button></div>
      <button id="step" class="primary" title="Advance one year (Enter)">Next year →</button>
    </div>
  </header>
  <div id="error" class="error" role="alert" hidden></div>
  <main id="content" aria-live="polite"><div class="loading"><span class="spinner"></span><h2>Loading simulation…</h2></div></main>
</div>

<section class="dock" aria-label="Console">
  <div id="dock-out" class="dock-out" hidden>
    <div class="dock-out-head"><span id="dock-cmd"></span><button id="dock-close" aria-label="Close output">✕</button></div>
    <pre id="console-output" tabindex="0"></pre>
  </div>
  <form id="command-form" autocomplete="off">
    <span class="prompt">›</span>
    <span class="cmd-wrap"><input id="command" placeholder='Type a command, e.g. person "Az Ee of Azar", country Azar, help edit   ( / to focus )' aria-label="Console command" spellcheck="false"><span id="console-pick" class="pick-list up" hidden></span></span>
    <button class="primary" type="submit">Run ↵</button>
  </form>
  <div class="dock-chips">
    <button data-prefill='person '>person…</button><button data-prefill='settlement '>settlement…</button><button data-prefill='country '>country…</button>
    <i></i>
    <button data-command="help">help</button><button data-command="help edit">help edit</button><button data-command="help ids">help ids</button>
    <i></i>
    <button data-command="people">people</button><button data-command="settlements">settlements</button><button data-command="countries">countries</button><button data-command="demographics">demographics</button><button data-command="wars">wars</button><button data-command="borders">borders</button><button data-command="projects">projects</button><button data-command="expeditions">expeditions</button><button data-command="systems">systems</button><button data-command="diseases">diseases</button><button data-command="richest">richest</button><button data-command="lineages">lineages</button><button data-command="changes">changes</button><button data-command="undo">undo</button>
  </div>
</section>

<dialog id="detail-dialog"><button class="close" aria-label="Close">×</button><div id="detail-content"></div></dialog>
<dialog id="report-dialog" class="wide"><button class="close" aria-label="Close">×</button><div class="report-head"><span class="eyebrow">REPORT</span><h2 id="report-title"></h2></div><pre id="report-text"></pre><div class="report-foot"><button data-copy>Copy text</button></div></dialog>
<dialog id="new-dialog">
  <button class="close" aria-label="Close">×</button>
  <span class="eyebrow">NEW SIMULATION</span><h2>Create a world</h2>
  <p class="muted">Starts four countries from your population and seed. This replaces the current world; save first to keep it.</p>
  <form id="new-form">
    <label class="field"><span>Starting population</span><input name="population" type="number" min="80" max="20000" value="2000" required></label>
    <label class="field"><span>Seed</span><span class="seedrow"><input name="seed" type="number" value="1" required><button type="button" id="random-seed">Random</button></span></label>
    <button class="primary block" type="submit">Create simulation</button>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
